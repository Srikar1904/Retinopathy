<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password • RetinaCare AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="forgot-body">

<div class="forgot-card">

<div class="forgot-icon">🔐</div>

<h1 class="forgot-title">Reset Password</h1>

<p class="forgot-sub">
Recover access to your RetinaCare account
</p>

<!-- STEP 1 -->

<div id="step1">

<form class="forgot-form">

<input type="email" id="email" placeholder="Enter your email" required>

<button type="button" class="btn-reset" onclick="sendOTP()">
Send OTP
</button>

</form>

</div>

<!-- STEP 2 -->

<div id="step2" style="display:none;">

<form class="forgot-form">

<input type="text" id="otp" placeholder="Enter OTP">

<button type="button" class="btn-reset" onclick="verifyOTP()">
Verify OTP
</button>

</form>

</div>

<!-- STEP 3 -->

<div id="step3" style="display:none;">

<form class="forgot-form">

<input type="password" id="newpass" placeholder="New Password">

<input type="password" id="confirmpass" placeholder="Confirm Password">

<button type="button" class="btn-reset" onclick="updatePassword()">
Update Password
</button>

</form>

</div>

<p id="reset-msg" class="reset-success"></p>

<div class="forgot-back">
Back to <a href="login.html">Login</a>
</div>

</div>

<script>

/* demo OTP */

let demoOTP="1234";

function sendOTP(){

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

document.getElementById("reset-msg").innerText="OTP sent to your email (demo OTP: 1234)";

}

function verifyOTP(){

let otp=document.getElementById("otp").value;

if(otp===demoOTP){

document.getElementById("step2").style.display="none";
document.getElementById("step3").style.display="block";

document.getElementById("reset-msg").innerText="OTP verified. Set new password.";

}

else{

document.getElementById("reset-msg").innerText="Invalid OTP";

}

}

function updatePassword(){

let p1=document.getElementById("newpass").value;
let p2=document.getElementById("confirmpass").value;

if(p1!==p2){

document.getElementById("reset-msg").innerText="Passwords do not match";
return;

}

document.getElementById("reset-msg").innerText="Password updated successfully";

}

</script>

</body>
</html>
